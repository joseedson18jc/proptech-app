<!doctype html><html><head><meta charset="utf-8"><title>PropTech</title><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>PropTech</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Locação residencial com custo total à vista: busca, visita, proposta, contrato, vistoria e repasse conciliado, com modelos de viabilidade e copiloto de IA.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
<link rel="stylesheet" href="styles.css">

<div class="app" id="app">
  <header class="top">
    <div class="top-in">
      <a class="brand" href="#morador" data-action="nav" data-view="morador" aria-label="PropTech, início">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="9" class="bm-bg"/><path d="M10 23V14.5L16 9l6 5.5V23" class="bm-line"/><path d="M14 23v-4.5a2 2 0 0 1 4 0V23" class="bm-line"/></svg>
        <span class="brand-text">PropTech</span>
      </a>
      <nav class="topnav" id="nav" aria-label="Visões"></nav>
      <div class="top-actions">
        <label class="city-pick" for="citySel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg><select id="citySel" data-input="city" aria-label="Cidade do cenário"></select></label>
        <button class="btn ghost kbd-btn" data-action="palette" aria-label="Abrir comandos"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><kbd>⌘K</kbd></button>
        <button class="btn icon ghost theme-btn" data-action="theme" aria-label="Alternar modo noturno" title="Modo noturno: automático das 18h às 6h"><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg><svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        <button class="btn ai-btn" data-action="copilot" aria-label="Abrir copiloto de IA"><svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c.6 4.2 2.8 6.4 7 7-4.2.6-6.4 2.8-7 7-.6-4.2-2.8-6.4-7-7 4.2-.6 6.4-2.8 7-7Z"/></svg><span>Copiloto</span></button>
      </div>
    </div>
  </header>

  <main class="main" id="main" tabindex="-1"></main>

  <nav class="tabbar" id="tabbar" aria-label="Visões"></nav>
  <aside class="copilot" id="copilot" hidden aria-label="Copiloto de IA"></aside>
  <div class="scrim" id="scrim" hidden data-action="close-overlays"></div>
  <section class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="Detalhe do imóvel"></section>
  <div class="palette" id="palette" hidden role="dialog" aria-modal="true" aria-label="Comandos"></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</div>

<script src="models.js"></script>
<script src="data.js"></script>
<script src="core.js"></script>
<script src="charts.js"></script>
<script src="art.js"></script>
<script src="view-morador.js"></script>
<script src="view-dono.js"></script>
<script src="view-operacao.js"></script>
<script src="view-viabilidade.js"></script>
<script src="view-investir.js"></script>
<script src="copilot.js"></script>
<script src="main.js"></script>
</body></html>
